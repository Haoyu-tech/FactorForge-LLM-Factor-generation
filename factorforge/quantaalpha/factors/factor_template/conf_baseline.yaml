qlib_init:
  provider_uri: /home/alpha/projects/QuantaAlpha/data/qlib/wrds_sp500
  region: us
market: sp500
benchmark: ^GSPC
data_handler_config: &id001
  start_time: '1925-12-31'
  end_time: '2025-12-31'
  instruments: sp500
  data_loader:
    class: qlib.contrib.data.loader.QlibDataLoader
    kwargs:
      config:
        feature:
        - - ($close-$open)/$open
          - $volume/Mean($volume, 20)
          - ($high-$low)/Ref($close, 1)
          - $close/Ref($close, 1)-1
        - - OPEN_RET
          - VOL_RATIO
          - RANGE_RET
          - CLOSE_RET
        label:
        - - Ref($close, -2)/Ref($close, -1) - 1
        - - LABEL0
  learn_processors:
  - class: Fillna
    kwargs:
      fields_group: feature
  - class: DropnaLabel
  - class: CSRankNorm
    kwargs:
      fields_group: feature
  - class: CSRankNorm
    kwargs:
      fields_group: label
  infer_processors:
  - class: Fillna
    kwargs:
      fields_group: feature
  - class: CSRankNorm
    kwargs:
      fields_group: feature
  - class: CSRankNorm
    kwargs:
      fields_group: label
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2010-01-04'
    end_time: '2025-12-31'
    account: 100000000
    benchmark: ^GSPC
    exchange_kwargs:
      codes: sp500
      limit_threshold: null
      deal_price: open
      open_cost: 0.0005
      close_cost: 0.0005
      min_cost: 0
      trade_unit: 1
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.05
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      early_stopping_round: 50
      num_boost_round: 500
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: DataHandlerLP
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '1925-12-31'
        - '1999-12-31'
        valid:
        - '2000-01-03'
        - '2009-12-31'
        test:
        - '2010-01-04'
        - '2025-12-31'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
